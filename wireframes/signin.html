```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillsTrack - Sign In</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222222;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* ================================
           HEADER
        ================================= */

        header {
            height: 80px;

            border-bottom: 2px solid #222222;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-link {
            border: 2px solid #222222;
            padding: 10px 18px;

            text-decoration: none;
            color: #222222;

            font-weight: bold;
        }

        /* ================================
           MAIN
        ================================= */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;
        }

        .signin-container {
            width: 100%;
            max-width: 500px;

            border: 2px solid #222222;

            padding: 45px;
        }

        .signin-container h1 {
            text-align: center;

            font-size: 36px;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            margin-bottom: 35px;

            line-height: 1.5;
        }

        /* ================================
           FORM
        ================================= */

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 2px solid #222222;

            font-size: 16px;
        }

        input:focus {
            outline: 3px solid #cccccc;
        }

        .signin-button {
            width: 100%;

            padding: 15px;

            border: 2px solid #222222;

            background: #eeeeee;

            color: #222222;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .signin-button:hover {
            background: #dddddd;
        }

        /* ================================
           EXTRA LINKS
        ================================= */

        .form-links {
            margin-top: 25px;

            text-align: center;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .form-links a {
            color: #222222;

            font-weight: bold;
        }

        /* ================================
           WIREFRAME NOTE
        ================================= */

        .wireframe-note {
            margin-top: 30px;

            padding: 15px;

            border: 2px dashed #777777;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }

        /* ================================
           FOOTER
        ================================= */

        footer {
            border-top: 2px solid #222222;

            padding: 20px;

            text-align: center;

            font-size: 14px;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            header {
                padding: 20px;

                height: auto;
            }

            .signin-container {
                padding: 30px 20px;
            }

            .signin-container h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header>

        <div class="logo">
            SKILLSTRACK
        </div>

        <a
            href="landing.html"
            class="back-link"
        >
            BACK HOME
        </a>

    </header>


    <!-- ================================
         SIGN IN
    ================================= -->

    <main>

        <section class="signin-container">

            <h1>
                SIGN IN
            </h1>

            <p class="subtitle">
                Sign in to access your SkillsTrack learner dashboard.
            </p>


            <form id="signinForm">

                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- SIGN IN BUTTON -->

                <button
                    type="submit"
                    class="signin-button"
                >
                    SIGN IN
                </button>

            </form>


            <!-- LINKS -->

            <div class="form-links">

                <a href="#">
                    Forgot Password?
                </a>

                <a href="create-account.html">
                    Don't have an account? Create Account
                </a>

            </div>


            <!-- WIREFRAME INFORMATION -->

            <div class="wireframe-note">

                <strong>WIREFRAME:</strong>

                Authentication will be connected to
                Firebase later.

            </div>

        </section>

    </main>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        <p>
            © 2026 SkillsTrack
        </p>

    </footer>


    <!-- ================================
         TEMPORARY NAVIGATION
    ================================= -->

    <script>

        const signinForm =
            document.getElementById("signinForm");

        signinForm.addEventListener("submit", function(event) {

            event.preventDefault();

            /*
                Temporary wireframe navigation.

                Firebase authentication will replace
                this later.
            */

            window.location.href = "dashboard.html";

        });

    </script>

</body>
</html>
```
