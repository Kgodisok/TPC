<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillsTrack - Create Account</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222222;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* ================================
           HEADER
        ================================= */

        header {
            height: 80px;

            border-bottom: 2px solid #222222;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-link {
            border: 2px solid #222222;

            padding: 10px 18px;

            text-decoration: none;

            color: #222222;

            font-weight: bold;
        }

        /* ================================
           MAIN
        ================================= */

        main {
            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 20px;
        }

        .account-container {
            width: 100%;

            max-width: 550px;

            border: 2px solid #222222;

            padding: 40px;
        }

        .account-container h1 {
            text-align: center;

            font-size: 36px;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            margin-bottom: 30px;

            line-height: 1.5;
        }

        /* ================================
           FORM
        ================================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;

            padding: 13px;

            border: 2px solid #222222;

            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: 3px solid #cccccc;
        }

        /* ================================
           BUTTON
        ================================= */

        .create-button {
            width: 100%;

            padding: 15px;

            border: 2px solid #222222;

            background: #eeeeee;

            color: #222222;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .create-button:hover {
            background: #dddddd;
        }

        /* ================================
           LOGIN LINK
        ================================= */

        .login-link {
            text-align: center;

            margin-top: 25px;
        }

        .login-link a {
            color: #222222;

            font-weight: bold;
        }

        /* ================================
           WIREFRAME NOTE
        ================================= */

        .wireframe-note {
            margin-top: 25px;

            padding: 15px;

            border: 2px dashed #777777;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }

        /* ================================
           FOOTER
        ================================= */

        footer {
            border-top: 2px solid #222222;

            padding: 20px;

            text-align: center;

            font-size: 14px;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            header {
                padding: 20px;

                height: auto;
            }

            .account-container {
                padding: 30px 20px;
            }

            .account-container h1 {
                font-size: 30px;
            }
        }

    </style>
</head>


<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header>

        <div class="logo">
            SKILLSTRACK
        </div>

        <a
            href="landing.html"
            class="back-link"
        >
            BACK HOME
        </a>

    </header>


    <!-- ================================
         CREATE ACCOUNT
    ================================= -->

    <main>

        <section class="account-container">

            <h1>
                CREATE ACCOUNT
            </h1>

            <p class="subtitle">
                Create your SkillsTrack learner account.
            </p>


            <form id="accountForm">

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select account type
                        </option>

                        <option value="learner">
                            Learner
                        </option>

                        <option value="facilitator">
                            Facilitator
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    class="create-button"
                >
                    CREATE ACCOUNT
                </button>

            </form>


            <!-- SIGN IN LINK -->

            <div class="login-link">

                <p>
                    Already have an account?
                    <a href="signin.html">
                        Sign In
                    </a>
                </p>

            </div>


            <!-- WIREFRAME NOTE -->

            <div class="wireframe-note">

                <strong>WIREFRAME:</strong>

                Account registration will be connected
                to Firebase Authentication later.

            </div>

        </section>

    </main>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer>

        <p>
            © 2026 SkillsTrack
        </p>

    </footer>


    <!-- ================================
         TEMPORARY NAVIGATION
    ================================= -->

    <script>

        const accountForm =
            document.getElementById("accountForm");

        accountForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                alert("Passwords do not match.");

                return;
            }


            /*
                Temporary wireframe navigation.

                Firebase Authentication will replace
                this later.
            */

            window.location.href = "signin.html";

        });

    </script>

</body>
</html>
