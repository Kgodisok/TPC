<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="landingPage.css">
</head>
<body class="page-body">
    <header class="navbar">
        <div class="brand">LearnFlow</div>
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#features">Features</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
        <a class="nav-button" href="#signup">Sign Up</a>
    </header>

    <main class="main-content">
        <section class="hero" id="home">
            <div class="hero-text">
                <h1>Welcome Back</h1>
                <p>Sign in to continue your learning streak and access personalized lessons.</p>
            </div>
            <div class="login-card">
                <h2>Login</h2>
                <form>
                    <label for="username">Email</label>
                    <input
                        type="email"
                        id="username"
                        name="username"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit">Login</button>
                </form>
                <p class="login-footer">New here? <a href="#signup">Create an account</a></p>
            </div>
        </section>
    </main>
</body>
</html>
