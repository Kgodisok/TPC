<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Learner Portal</title>
    <link rel="stylesheet" href="styles/landingPage.css">
</head>
<body class="page-body">
    <header class="navbar">
        <div class="brand">
            <img src="images/logo.svg" alt="Logo" class="logo">
            <span>Learner Portal</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero">
            <div class="hero-left">
                <aside class="dev-panel">
                    <h2>Developers</h2>
                    <ul class="developer-list">
                        <li>
                            <span class="developer-name">Matsepe Kgodiso</span>
                            <a class="developer-email" href="mailto:KgodisoM@tpcstudents.co.za">KgodisoM@tpcstudents.co.za</a>
                        </li>
                        <li>
                            <span class="developer-name">Karrel Esterhuizen</span>
                            <a class="developer-email" href="mailto:karrelE@tpcstudents.co.za">karrelE@tpcstudents.co.za</a>
                        </li>
                        <li>
                            <span class="developer-name">Sibusiso Nhlapo</span>
                            <a class="developer-email" href="mailto:sibusisoN@tpcstudents.co.za">sibusisoN@tpcstudents.co.za</a>
                        </li>
                    </ul>
                </aside>
            </div>

            <div class="login-card">
                <h2>Login</h2>
                <p>Enter your credentials to access the learner portal.</p>
                <h4 id="loginErrorMessage"></h4>
                <form action="#" method="post">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                    <button id="loginBtn" type="submit">Login</button>
                </form>
                <p class="login-footer">Don't have an account? <a href="index.html">Sign up</a></p>
            </div>
        </section>
    </main>
    <script src="ui.js" defer></script>
</body>
</html>
