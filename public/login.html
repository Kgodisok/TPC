<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillsTrack | Sign in</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body data-page="login">
    <header class="site-header">
      <div class="brand-block">
        <span class="brand-mark">S</span>
        <span>SkillsTrack</span>
      </div>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
      <a class="nav-button" href="../index.html">Back home</a>
    </header>

    <main class="auth-shell">
      <section class="auth-card">
        <div class="tab-row">
          <button class="auth-tab active" data-auth-tab="login" type="button">Sign in</button>
          <button class="auth-tab" data-auth-tab="register" type="button">Create account</button>
        </div>

        <form id="loginForm" class="auth-form active">
          <h1>Welcome back</h1>
          <p class="supporting-text">Enter your details to continue to your dashboard.</p>

          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" required />

          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="Your password" required />

          <button class="primary-button full-width" type="submit">Sign in</button>
        </form>

        <form id="registerForm" class="auth-form hidden">
          <h1>Create account</h1>
          <p class="supporting-text">Set up your learning portal in a few seconds.</p>

          <label for="registerName">Full name</label>
          <input id="registerName" type="text" placeholder="Your full name" required />

          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" placeholder="you@example.com" required />

          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" placeholder="Create a password" required />

          <button class="primary-button full-width" type="submit">Create account</button>
        </form>

        <p id="authMessage" class="auth-message" aria-live="polite"></p>
      </section>
    </main>

    <script src="../js/app.js"></script>
  </body>
</html>
